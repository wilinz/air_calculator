# 重新生成：dart run ffigen --config ffigen.yaml
#
# src/aircalc.h 从 air_calculator-rs/include/aircalc.h 拷来，两边保持同步。
# 那份头文件是手写的，同时供 Swift 与 JNI 直接引用——不用
# flutter_rust_bridge 正是为了这一点：核心库不绑定任何宿主语言。
name: MwhBindings
description: mwh C ABI 的生成绑定。
output: lib/src/bindings.dart
# native assets 查找：符号来自 build hook 产出的 code asset，运行时
# 不需要 dlopen，也不用定位动态库。asset-id 必须与 hook 里一致。
ffi-native:
  asset-id: 'package:aircalc_native/src/bindings.dart'
headers:
  entry-points:
    - src/aircalc.h
  include-directives:
    - src/aircalc.h
preamble: |
  // 由 package:ffigen 从 src/aircalc.h 生成，请勿手工编辑。
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
